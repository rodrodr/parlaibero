# Cada semana: ¿siguen respondiendo los DOI de todos los conjuntos, la colección y el explorador?
# El sitio promete que «los datos no se han movido: cada país sigue en su DOI». Esto lo vigila.
#
# Ninguna URL se escribe aquí: los DOI salen de src/data/paises.json y los otros dos destinos de
# src/config/enlaces.ts, que es donde viven todas las URL externas del sitio.
name: Enlaces externos

on:
  schedule:
    - cron: '17 6 * * 1'   # lunes, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lista de destinos
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const paises = JSON.parse(readFileSync("src/data/paises.json", "utf8"));
            const enlaces = readFileSync("src/config/enlaces.ts", "utf8");
            const de = (clave) => {
              const m = enlaces.match(new RegExp(clave + ":\\s*\x27([^\x27]+)\x27"));
              if (!m) throw new Error("No encuentro «" + clave + "» en src/config/enlaces.ts");
              return m[1];
            };
            for (const p of paises) console.log(["doi", p.iso, p.url].join("\t"));
            // La página de la colección está tras un reto de JavaScript (curl recibe un 202 que no dice
            // nada). La API nativa de Dataverse sí contesta: 200 si la colección existe, 404 si no.
            console.log(["pagina", "coleccion", de("coleccion").replace(/\/dataverse\/([^/?#]+).*$/, "/api/dataverses/$1")].join("\t"));
            console.log(["pagina", "explorador", de("explorador")].join("\t"));
          ' > destinos.tsv
          cat destinos.tsv

      - name: Comprobar con curl
        run: |
          fallos=0
          while IFS=$'\t' read -r tipo nombre url; do
            if [ "$tipo" = "doi" ]; then
              # Un DOI está vivo si doi.org lo RESUELVE hacia Harvard Dataverse. No se sigue la redirección:
              # el borde de Dataverse responde 403 a las ráfagas automáticas, y eso no diría nada del DOI.
              salida=$(curl -sS -o /dev/null --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
                -w '%{http_code} %{redirect_url}' "$url" || echo "000 -")
              codigo=${salida%% *}; destino=${salida#* }
              if [[ "$codigo" =~ ^30[1278]$ && "$destino" == *dataverse.harvard.edu* ]]; then
                echo "✓ $nombre  $url → $destino"
              else
                echo "::error title=DOI sin resolver ($nombre)::$url respondió $codigo → ${destino:-sin destino}"
                fallos=$((fallos + 1))
              fi
            else
              codigo=$(curl -sS -L -o /dev/null --max-time 45 --retry 3 --retry-delay 20 --retry-all-errors \
                -A 'parlaibero-site · comprobacion semanal de enlaces' -w '%{http_code}' "$url" || echo 000)
              if [ "$codigo" = "200" ]; then
                echo "✓ $nombre  $url"
              else
                echo "::error title=No responde ($nombre)::$url respondió $codigo"
                fallos=$((fallos + 1))
              fi
            fi
            sleep 2
          done < destinos.tsv
          if [ "$fallos" -gt 0 ]; then
            echo "✗ $fallos destinos no responden."
            exit 1
          fi
          echo "✓ Todos los destinos responden."
